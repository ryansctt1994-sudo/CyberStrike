name: cyberstrike

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read

jobs:
  # Intentionally NOT enabled for forks. This gate must never receive model secrets.
  preflight:
    if: github.repository == 'CyberStrikeus/CyberStrike'
    runs-on: ubuntu-24.04
    outputs:
      authorized: ${{ steps.guard.outputs.authorized }}
    permissions:
      contents: read
    steps:
      - name: Checkout trusted default-branch code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Authorize comment without model secrets
        id: guard
        run: node .github/scripts/agent-gate.mjs

  cyberstrike:
    needs: preflight
    if: github.repository == 'CyberStrikeus/CyberStrike' && needs.preflight.outputs.authorized == 'true'
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun
      # SECURITY HOLD: this action must be audited and pinned to a reviewed SHA before enabling.
      - name: Run cyberstrike
        uses: CyberStrikeus/CyberStrike/github@7ace779e02f3c6bd3eb57e975e5c497499899604
        env:
          CYBERSTRIKE_API_KEY: ${{ secrets.CYBERSTRIKE_API_KEY }}
          CYBERSTRIKE_PERMISSION: '{"bash": "deny"}'
        with:
          model: cyberstrike/claude-opus-4-5
